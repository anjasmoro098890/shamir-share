[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "shamir-share"
version = "0.1.0"
description = "Shamir-style share coordinator — quorum count, local vault."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Vault Labs"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.1",
    "pycryptodome>=3.20"
]

[project.scripts]
shamirshare = "shamirshare.__main__:main"

[tool.setuptools.packages.find]
include = ["shamirshare*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
